<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#00A59B" />
  
  <!-- Shadow for main window -->
  <rect x="76" y="76" width="360" height="360" fill="#000000" />
  
  <!-- Main window (Terminal Black fill instead of Yellow) -->
  <rect x="64" y="64" width="360" height="360" fill="#000000" stroke="#000000" stroke-width="8" />
  
  <!-- Header bar (kept from v1) -->
  <rect x="64" y="64" width="360" height="48" fill="#000000" />
  <text x="80" y="98" font-family="monospace" font-size="24" font-weight="bold" fill="#FFFFFF">_comple_.apk</text>
  
  <!-- Inner border (Terminal Green to be visible on black) -->
  <rect x="72" y="72" width="344" height="344" fill="none" stroke="#00FF41" stroke-width="2" />
  
  <!-- Big text inside (Terminal Green) -->
  <text x="244" y="240" font-family="monospace" font-size="48" font-weight="900" fill="#00FF41" text-anchor="middle">_comple_</text>
  
  <!-- Button with shadow -->
  <!-- Shadow is green to be visible against black background -->
  <rect x="160" y="288" width="168" height="48" fill="#00FF41" />
  <rect x="156" y="284" width="168" height="48" fill="#000000" stroke="#00FF41" stroke-width="4" />
  <text x="240" y="316" font-family="monospace" font-size="20" font-weight="bold" fill="#00FF41" text-anchor="middle">TRACK</text>
</svg>
