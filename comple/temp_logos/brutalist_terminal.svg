<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#00A59B" />
  
  <!-- Shadow for main window -->
  <!-- Offset black block, but the main window is also black. 
       To make it stand out, we'll keep it black since the main window has a bright green border. -->
  <rect x="76" y="76" width="360" height="360" fill="#000000" />
  
  <!-- Main window -->
  <rect x="64" y="64" width="360" height="360" fill="#000000" stroke="#00FF41" stroke-width="8" />
  
  <!-- Inner border -->
  <rect x="72" y="72" width="344" height="344" fill="none" stroke="#00FF41" stroke-width="2" />
  
  <!-- Header bar -->
  <rect x="64" y="64" width="360" height="48" fill="#00FF41" />
  <text x="80" y="98" font-family="monospace" font-size="24" font-weight="bold" fill="#000000">_comple_.apk</text>
  
  <!-- Text inside -->
  <text x="244" y="240" font-family="monospace" font-size="48" font-weight="900" fill="#00FF41" text-anchor="middle">_comple_</text>
  
  <!-- Button with shadow -->
  <!-- Shadow is green to pop against the black background of the window -->
  <rect x="160" y="288" width="168" height="48" fill="#00FF41" />
  <rect x="156" y="284" width="168" height="48" fill="#000000" stroke="#00FF41" stroke-width="4" />
  <text x="240" y="316" font-family="monospace" font-size="20" font-weight="bold" fill="#00FF41" text-anchor="middle">TRACK</text>
</svg>
