<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#00A59B" />
  
  <!-- Shadow for main window -->
  <rect x="76" y="76" width="360" height="360" fill="#000000" />
  
  <!-- Main window -->
  <rect x="64" y="64" width="360" height="360" fill="#000000" stroke="#000000" stroke-width="8" />
  
  <!-- Header bar -->
  <rect x="64" y="64" width="360" height="48" fill="#000000" />
  <text x="80" y="98" font-family="monospace" font-size="24" font-weight="bold" fill="#FFFFFF">app.apk</text>
  
  <!-- Separator Line (Double Green) -->
  <line x1="64" y1="114" x2="424" y2="114" stroke="#00FF41" stroke-width="2" />
  <line x1="64" y1="120" x2="424" y2="120" stroke="#00FF41" stroke-width="2" />
  
  <!-- Inner border (adjusted to start below separator) -->
  <rect x="72" y="132" width="344" height="284" fill="none" stroke="#00FF41" stroke-width="2" />
  
  <!-- Big text inside (Teal) -->
  <text x="244" y="240" font-family="monospace" font-size="48" font-weight="900" fill="#00A59B" text-anchor="middle">_comple_</text>
  
  <!-- Button with shadow -->
  <rect x="160" y="288" width="168" height="48" fill="#00FF41" />
  <rect x="156" y="284" width="168" height="48" fill="#000000" stroke="#00FF41" stroke-width="4" />
  <text x="240" y="316" font-family="monospace" font-size="20" font-weight="bold" fill="#00FF41" text-anchor="middle">TRACK</text>
</svg>
